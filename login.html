<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC Thumbnail Studio — Accedi</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; }
  .login-card{ width:100%; max-width:380px; }
  .login-logo{ text-align:center; margin-bottom:22px; }
  .login-logo .brand-dot{ display:inline-block; }
  .login-title{ font-size:20px; font-weight:800; margin-top:8px; }
  .login-sub{ font-size:12px; color:var(--grigio); margin-top:4px; }
  .login-switch{ text-align:center; margin-top:12px; font-size:12.5px; color:var(--grigio); }
  .login-switch button{ background:none; border:none; color:var(--sabbia-dk); font-weight:700; cursor:pointer; font-family:'Jost',sans-serif; font-size:inherit; text-decoration:underline; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <span class="brand-dot" style="width:14px;height:14px;"></span>
    <div class="login-title">GDC Thumbnail Studio</div>
    <div class="login-sub" id="modeSub">Accedi al tuo account</div>
  </div>

  <div class="card">
    <div id="loginError" class="error-banner hidden mb-8"></div>
    <div id="loginOk" class="ok-banner hidden mb-8"></div>
    <form id="authForm">
      <div class="field">
        <label class="lbl" for="email">Email</label>
        <input class="inp" type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <input class="inp" type="password" id="password" required autocomplete="current-password" minlength="6">
      </div>
      <button class="btn btn-p btn-block" type="submit" id="authBtn">Accedi</button>
    </form>
    <div class="login-switch">
      <span id="switchPrompt">Primo accesso?</span>
      <button type="button" id="switchBtn" onclick="toggleMode()">Crea un account</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
if (getToken()) window.location.href = 'onboarding.html';

let MODE = 'login'; // 'login' | 'signup'

function toggleMode(){
  MODE = MODE === 'login' ? 'signup' : 'login';
  document.getElementById('authBtn').textContent = MODE === 'login' ? 'Accedi' : 'Crea account';
  document.getElementById('modeSub').textContent = MODE === 'login' ? 'Accedi al tuo account' : 'Crea il tuo account';
  document.getElementById('switchPrompt').textContent = MODE === 'login' ? 'Primo accesso?' : 'Hai già un account?';
  document.getElementById('switchBtn').textContent = MODE === 'login' ? 'Crea un account' : 'Accedi';
  document.getElementById('loginError').classList.add('hidden');
  document.getElementById('loginOk').classList.add('hidden');
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('authBtn');
  const errEl = document.getElementById('loginError');
  const okEl = document.getElementById('loginOk');
  errEl.classList.add('hidden'); okEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = MODE === 'login' ? 'Accesso in corso…' : 'Creazione account…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    if (MODE === 'login') {
      const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenziali non valide');
      setSession(data);
      window.location.href = 'onboarding.html';
    } else {
      const res = await fetch(`${SUPA_URL}/auth/v1/signup`, {
        method: 'POST',
        headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.msg || 'Impossibile creare l\'account');
      if (data.access_token) {
        setSession(data);
        window.location.href = 'onboarding.html';
      } else {
        okEl.textContent = 'Account creato — controlla la tua email per confermarla, poi accedi.';
        okEl.classList.remove('hidden');
        toggleMode();
      }
    }
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = MODE === 'login' ? 'Accedi' : 'Crea account';
  }
});
</script>
</body>
</html>
