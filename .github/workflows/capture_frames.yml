name: Cattura Frame (raccolta automatica volto)

on:
  workflow_dispatch: {}
  schedule:
    # ogni 6 ore — processa i job "in coda" creati dal tool cliccando
    # "Avvia raccolta automatica" nella scheda Galleria volto
    - cron: '0 */6 * * *'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installa dipendenze Python
        run: pip install -r scripts/requirements.txt

      - name: Esegui raccolta frame
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/capture_frames.py
